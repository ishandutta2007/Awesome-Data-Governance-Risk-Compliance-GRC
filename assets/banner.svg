<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .title-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .pill-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .tag-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-orb-1 {
      transform-origin: 980px 140px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulsing-orb-2 {
      transform-origin: 180px 320px;
      animation: pulseGlow 9s ease-in-out infinite;
    }
    .pill-float-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 5s ease-in-out infinite; }
    .pill-float-3 { animation: floatPill3 4.5s ease-in-out infinite; }
    .animated-orbit {
      stroke-dasharray: 6 6;
      animation: dashCycle 20s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs (Behind content) -->
  <circle class="pulsing-orb-1" cx="980" cy="140" r="150" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="pulsing-orb-2" cx="180" cy="320" r="130" fill="#0284c7" opacity="0.2" filter="url(#glow)" />

  <!-- Background Tech Grid Pattern -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="420" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="420" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="420" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="420" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="420" class="grid-line" />

    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
  </g>

  <!-- Orbiting Circuit Accent in Background Right -->
  <g transform="translate(980, 190)" opacity="0.35">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#818cf8" stroke-width="1.5" class="animated-orbit" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c084fc" stroke-width="1.5" class="animated-orbit" />
    <!-- Node Dots -->
    <circle cx="110" cy="0" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="-53" cy="53" r="3.5" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="0" cy="-75" r="3" fill="#818cf8" filter="url(#subtleGlow)" />
  </g>

  <!-- Foreground Content (Solid, distinct, unhindered) -->
  <g transform="translate(80, 0)">
    <!-- Top Super-header Badge -->
    <g transform="translate(0, 68)">
      <rect width="365" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" class="tag-title">ENTERPRISE SECURITY &amp; COMPLIANCE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 148)">
      <text class="title-text">
        Awesome Data Governance, Risk &amp; Compliance
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 192)">
      <text class="subtitle-text">
        Curated SaaS Platforms, Open-Source GRC Software, Policy Engines &amp; Audit Automation
      </text>
    </g>

    <!-- Decorative Gradient Accent Divider -->
    <g transform="translate(0, 222)">
      <rect width="780" height="3" rx="1.5" fill="url(#accentGrad)" />
    </g>

    <!-- Interactive / Floating Category Cards / Pills -->
    <!-- Pill 1: Risk & Compliance Frameworks -->
    <g transform="translate(0, 255)" class="pill-float-1">
      <rect width="245" height="58" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="29" r="10" fill="#0284c7" opacity="0.5" />
      <text x="28" y="34" text-anchor="middle" font-size="13" fill="#38bdf8">🛡️</text>
      <text x="48" y="27" class="pill-text" fill="#f8fafc">Regulatory Frameworks</text>
      <text x="48" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">SOC 2 • ISO 27001 • NIST • GDPR</text>
    </g>

    <!-- Pill 2: Open Source Tools -->
    <g transform="translate(265, 255)" class="pill-float-2">
      <rect width="255" height="58" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="29" r="10" fill="#4338ca" opacity="0.5" />
      <text x="28" y="34" text-anchor="middle" font-size="13" fill="#818cf8">⚡</text>
      <text x="48" y="27" class="pill-text" fill="#f8fafc">Open-Source Engines</text>
      <text x="48" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">CISO Assistant • OPA • Prowler</text>
    </g>

    <!-- Pill 3: Enterprise SaaS Platforms -->
    <g transform="translate(540, 255)" class="pill-float-3">
      <rect width="245" height="58" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="29" r="10" fill="#7e22ce" opacity="0.5" />
      <text x="28" y="34" text-anchor="middle" font-size="13" fill="#c084fc">🏢</text>
      <text x="48" y="27" class="pill-text" fill="#f8fafc">Enterprise SaaS IRM</text>
      <text x="48" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">ServiceNow • AuditBoard • OneTrust</text>
    </g>

    <!-- Bottom Highlights -->
    <g transform="translate(0, 350)">
      <circle cx="8" cy="8" r="4" fill="#10b981" />
      <text x="22" y="12" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" font-weight="500">
        Continuous Evidence Collection • Policy as Code • Cloud Security Posture • Audit-Ready Workflows
      </text>
    </g>
  </g>
</svg>